name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($r.FailedCount) { exit 1 }
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: JSON files parse
        shell: pwsh
        run: |
          foreach ($f in 'default/config.json', 'zebar/omarchy/menu.json') { Get-Content -Raw $f | ConvertFrom-Json | Out-Null }
      - name: AutoHotkey scripts load
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The portable zip from AutoHotkey's GitHub releases (autohotkey.com blocks CI runners).
          gh release download --repo AutoHotkey/AutoHotkey --pattern 'AutoHotkey_2*.zip' --output ahk.zip
          Expand-Archive ahk.zip ahk-bin
          $ahk = (Get-Item ahk-bin/AutoHotkey64.exe).FullName
          # AutoHotkey64.exe is a GUI program: & would not wait for it or set $LASTEXITCODE.
          function Test-AhkLoads([string]$file) {
            $p = Start-Process $ahk -ArgumentList '/ErrorStdOut', '/validate', "`"$file`"" -Wait -PassThru -RedirectStandardError ahk.err -RedirectStandardOutput ahk.out
            $err = (Get-Content -Raw ahk.err) + (Get-Content -Raw ahk.out)
            if ($err) { Write-Host $err }
            -not $p.ExitCode -and -not $err
          }
          # Prove the check can fail before trusting it to pass.
          Set-Content broken.ahk "#Requires AutoHotkey v2.0`nfoo(( bar"
          if (Test-AhkLoads (Resolve-Path broken.ahk)) { Write-Error 'the AutoHotkey check passed a broken script'; exit 1 }
          foreach ($s in Get-ChildItem ahk/*.ahk) {
            if (-not (Test-AhkLoads $s.FullName)) { Write-Error "$($s.Name) failed to load"; exit 1 }
          }

  # Every push to main is a release: bump the version, move the CHANGELOG's Unreleased
  # entries under it, commit, tag, and publish a GitHub release. A push made with
  # GITHUB_TOKEN starts no workflow, so the version commit can't set this off again.
  version:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip version]')
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency: version
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Bump the version
        id: bump
        shell: pwsh
        run: ./.github/scripts/release.ps1 -Before '${{ github.event.before }}' -After '${{ github.sha }}'
      - name: Commit, tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          NOTES: ${{ steps.bump.outputs.notes }}
          FILE: ${{ steps.bump.outputs.file }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $env:FILE CHANGELOG.md
          git commit -m "Version $env:VERSION [skip ci]"
          if ($LASTEXITCODE) { exit 1 }
          # Someone may have pushed while the tests ran: land on top of it.
          git pull --rebase origin main
          if ($LASTEXITCODE) { exit 1 }
          git tag "v$env:VERSION"
          git push origin HEAD:main "v$env:VERSION"
          if ($LASTEXITCODE) { exit 1 }
          gh release create "v$env:VERSION" --title "Winarchy $env:VERSION" --notes-file $env:NOTES --verify-tag
      - name: Update the repo description
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINARCHY_ADMIN_TOKEN }}
          DESCRIPTION: ${{ steps.bump.outputs.description }}
        run: |
          # Editing the description needs a token with Administration: write, which
          # GITHUB_TOKEN never has: the repo secret WINARCHY_ADMIN_TOKEN (see AGENTS.md).
          if (-not $env:GH_TOKEN) { Write-Host '::notice::WINARCHY_ADMIN_TOKEN is not set, so the repo description was left as it is.'; exit 0 }
          gh api -X PATCH "repos/${{ github.repository }}" -f description="$env:DESCRIPTION" --silent
