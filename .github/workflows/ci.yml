name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester + PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($r.FailedCount) { exit 1 }
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: JSON files parse
        shell: pwsh
        run: |
          foreach ($f in 'default/config.json', 'zebar/omarchy/menu.json') { Get-Content -Raw $f | ConvertFrom-Json | Out-Null }
      - name: AutoHotkey scripts load
        shell: pwsh
        run: |
          # The portable zip: hosted runners don't always have winget.
          Invoke-WebRequest https://www.autohotkey.com/download/ahk-v2.zip -OutFile ahk.zip
          Expand-Archive ahk.zip ahk-bin
          $ahk = Get-Item ahk-bin/AutoHotkey64.exe
          foreach ($s in Get-ChildItem ahk/*.ahk) {
            & $ahk.FullName /ErrorStdOut /validate $s.FullName
            if ($LASTEXITCODE) { Write-Error "$($s.Name) failed to load"; exit 1 }
          }
