<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="./display.css" />
    <link rel="stylesheet" type="text/css" href="./power.css" />
    <link rel="stylesheet" type="text/css" href="./theme.css" />
    <link rel="stylesheet" type="text/css" href="./font.css" />
    <link rel="stylesheet" type="text/css" href="./user.css" />
  </head>
  <body>
    <!-- Omarchy Quattro's Power panel (shell/plugins/panels/power), dropped under the bar's
         battery icon: the battery and the power profile. Arrows / h j k l: profile ·
         Enter: choose · Esc: close. -->
    <div id="wrap">
      <div id="panel" role="dialog" aria-label="Power">
        <header id="hero">
          <span class="glyph" id="heroGlyph" aria-hidden="true"></span>
          <div class="who">
            <span id="title">Battery</span>
            <span id="mood"></span>
          </div>
          <span id="percent">—</span>
        </header>

        <div id="meter" aria-hidden="true"><span class="fill"></span></div>

        <div id="stats" class="hidden">
          <div class="col">
            <div class="pair"><span class="label">Battery size</span><span class="val" id="size"></span></div>
            <div class="pair"><span class="label">Charge cycles</span><span class="val" id="cycles"></span></div>
          </div>
          <div class="col">
            <div class="pair"><span class="label" id="timeLabel"></span><span class="val" id="time"></span></div>
            <div class="pair"><span class="label" id="rateLabel"></span><span class="val" id="rate"></span></div>
          </div>
        </div>

        <section id="profileBox">
          <div class="head"><h2>Power profile</h2></div>
          <div id="profiles" role="radiogroup" aria-label="Power profile"></div>
        </section>
      </div>
    </div>
    <script type="module" src="./power.js"></script>
  </body>
</html>
