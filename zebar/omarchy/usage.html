<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="./usage.css" />
    <link rel="stylesheet" type="text/css" href="./theme.css" />
    <link rel="stylesheet" type="text/css" href="./font.css" />
    <link rel="stylesheet" type="text/css" href="./user.css" />
  </head>
  <body>
    <!-- The bar's agents panel (Omarchy's agents panel), dropped under the bar icon: every
         subscription's limits, and tiles that start the default agent making something.
         Clicking outside it closes it. -->
    <div id="panel" role="dialog" aria-label="AI coding agents">
      <header id="hero">
        <span class="glyph" aria-hidden="true"></span>
        <div class="who">
          <span id="title">Agents</span>
          <span id="today"></span>
        </div>
        <button id="add" class="add" title="Choose your default agent" aria-label="Choose your default agent"></button>
      </header>

      <div id="empty" class="hidden">
        <strong>No agent usage yet</strong>
        <span>It appears after a coding agent has run on this PC.</span>
      </div>
      <div id="agents"></div>

      <section id="make" aria-labelledby="makeTitle">
        <h2 id="makeTitle">Make something</h2>
        <div class="tiles">
          <button class="tile" data-kind="theme"><span class="icon" aria-hidden="true"></span><span>Theme</span></button>
          <button class="tile" data-kind="plugin"><span class="icon" aria-hidden="true"></span><span>Plugin</span></button>
          <button class="tile" data-kind="app"><span class="icon" aria-hidden="true"></span><span>App</span></button>
        </div>
      </section>

      <footer>
        <span id="updated"></span>
        <button id="refresh" title="Refresh (r)" aria-label="Refresh"></button>
      </footer>
      <div id="tip" class="hidden" role="tooltip"></div>
    </div>
    <script type="module" src="./usage.js"></script>
  </body>
</html>
