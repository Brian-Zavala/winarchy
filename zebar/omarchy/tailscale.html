<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="./display.css" />
    <link rel="stylesheet" type="text/css" href="./tailscale.css" />
    <link rel="stylesheet" type="text/css" href="./theme.css" />
    <link rel="stylesheet" type="text/css" href="./font.css" />
    <link rel="stylesheet" type="text/css" href="./user.css" />
  </head>
  <body>
    <!-- Omarchy Quattro's Tailscale panel (shell/plugins/panels/tailscale), dropped under the
         bar's Tailscale icon. j/k: move · Enter: choose · c/n/d: copy IP/name/DNS name ·
         s: send files · t: on/off · r: refresh · Esc: close. -->
    <div id="wrap">
      <div id="panel" role="dialog" aria-label="Tailscale">
        <header id="hero">
          <span class="glyph mark" id="heroMark" aria-hidden="true"></span>
          <div class="who">
            <span id="title">Tailscale</span>
            <span id="meta"></span>
          </div>
          <button class="switch" id="power" role="switch" aria-label="Tailscale on/off"><span class="knob"></span></button>
        </header>
        <div id="status" class="hidden" role="status"></div>

        <section id="accountsBox" class="hidden">
          <div class="head"><h2>Connections</h2></div>
          <div id="accounts" class="rows"></div>
        </section>

        <section id="exitBox" class="hidden">
          <div class="head"><h2>Exit nodes</h2><span class="value" id="exitValue"></span></div>
          <div id="exits" class="rows"></div>
        </section>

        <section id="peersBox" class="hidden">
          <div class="head"><h2>Machines</h2><span class="value" id="peerCount"></span></div>
          <div id="peers" class="rows"></div>
        </section>
        <footer id="keys">c/n/d copy · s send · t on/off · r refresh</footer>
      </div>
    </div>
    <script type="module" src="./tailscale.js"></script>
  </body>
</html>
