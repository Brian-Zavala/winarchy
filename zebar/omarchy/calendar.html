<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="./calendar.css" />
    <link rel="stylesheet" type="text/css" href="./theme.css" />
    <link rel="stylesheet" type="text/css" href="./font.css" />
    <link rel="stylesheet" type="text/css" href="./user.css" />
  </head>
  <body>
    <!-- The clock's calendar (Omarchy Quattro): a month grid with ISO week numbers,
         dropped under the clock. Clicking anywhere outside it closes it. -->
    <div id="panel">
      <button id="hero" title="Back to today"><span class="glyph"></span><span id="heroDate"></span></button>
      <div class="rail">
        <span class="label" id="year"></span>
        <span class="meter"><span id="yearFill"></span></span>
        <span id="yearPct"></span>
      </div>
      <div id="grid"></div>
      <div class="nav">
        <button class="step" id="prev" title="Previous month"></button>
        <span id="month"></span>
        <button class="step" id="next" title="Next month"></button>
      </div>
    </div>
    <script type="module" src="./calendar.js"></script>
  </body>
</html>
