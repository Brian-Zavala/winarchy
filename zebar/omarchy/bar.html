<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="./bar.css" />
    <link rel="stylesheet" type="text/css" href="./theme.css" id="theme" />
    <link rel="stylesheet" type="text/css" href="./font.css" id="font" />
    <link rel="stylesheet" type="text/css" href="./user.css" id="user" />
  </head>
  <body>
    <div id="bar">
      <div class="side">
        <div class="left">
          <span class="logo" id="logo" title="Omarchy menu (right click: terminal)"></span>
          <div id="workspaces"></div>
        </div>
        <!-- Quattro indicators: active ones sit next to the clock; hovering the
             center reveals the inactive ones (dimmed) further left. -->
        <div class="indicators" id="indicators">
          <span class="indicator uac hidden" id="uac"></span>
          <span class="indicator game hidden" id="game"></span>
          <span class="indicator off" id="dictation"></span>
          <span class="indicator off" id="recording"></span>
          <span class="indicator off" id="nightlight"></span>
          <span class="indicator off" id="dnd"></span>
          <span class="indicator off" id="awake"></span>
        </div>
      </div>
      <span id="clock" title="Click: calendar · Right-click: date format · Middle-click: world clock"></span>
      <div class="side">
        <div class="post" id="post">
          <span class="module hidden" id="media"></span>
          <span class="module hidden" id="reminder"></span>
          <span class="module" id="elsewhen" title="World clock (Super+Ctrl+Alt+E)"></span>
          <span class="module hidden" id="weather"></span>
          <span class="module update hidden" id="update"></span>
        </div>
        <div class="right">
          <!-- Everything except the Quattro system modules below hides behind the chevron:
               running-app windows and the native systray (background apps, not system state). -->
          <div class="drawer" id="drawer">
            <button class="chevron hidden" id="winChevron" title="Open windows"></button>
            <div class="winstrip" id="winstrip"></div>
            <div class="tray" id="tray"></div>
          </div>
          <span class="module hidden" id="agents"></span>
          <span class="module hidden" id="bluetooth"></span>
          <!-- Quattro's omarchy.tailscale: only there once Tailscale is installed. -->
          <span class="module hidden" id="tailscale"></span>
          <span class="module" id="network"></span>
          <span class="module" id="audio"></span>
          <!-- Quattro's omarchy.monitor: brightness, text size, scale, displays. -->
          <span class="module" id="display"></span>
          <span class="module" id="cpu"></span>
          <span class="module hidden" id="battery"></span>
        </div>
      </div>
    </div>

    <script type="module">
      // Omarchy-style bar (mirrors Omarchy's top bar: logo + workspaces left,
      // clock pinned to the center with indicators to its left, tray + status icons right).
      // zebar.mjs is a vendored copy of zebar@3 so the bar draws even offline.
      import * as zebar from './zebar.mjs';
      // Machine paths + settings, written by `winarchy apply`.
      import { AHK, MENU, CLOCK_24H } from './env.js';

      const ICONS = {
        logo: '\uE900',             // Omarchy logo (omarchy.ttf)
        activeWs: '\u{F14FB}',      // Omarchy's active workspace glyph
        awake: '\u{F0176}',         // coffee (Omarchy Quattro indicator glyphs)
        nightlight: '\u{F050E}',    // night light
        dnd: '\u{F009B}',           // bell off
        dictation: '\u{F036C}',     // microphone
        recording: '\u{F0EC2}',     // record
        uac: '',              // shield (admin prompt waiting)
        game: '\u{F0297}',          // gamepad (a game is running)
        update: '\uF0AB',           // arrow-circle-down (Omarchy system-update)
        agents: '\u{F06A9}',        // robot (AI coding agent usage, Omarchy's agents widget)
        cpu: '\u{F035B}',
        ethernet: '\u{F0002}',
        wifi: ['\u{F092F}', '\u{F091F}', '\u{F0922}', '\u{F0925}', '\u{F0928}'],
        offline: '\u{F092E}',
        vol: ['\u{F057F}', '\u{F0580}', '\u{F057E}'],
        mute: '\u{F075F}',
        btOn: '\u{F00AF}',
        btOff: '\u{F00B2}',
        battery: ['\u{F008E}', '\u{F007A}', '\u{F007C}', '\u{F007E}', '\u{F0080}', '\u{F0079}'],
        charging: '\u{F0084}',
        chevron: '\u{F0141}',       // chevron-left (running-windows flyout)
        monitor: '\u{F0379}',       // Quattro's display widget: monitor, or monitor-multiple
        monitors: '\u{F037A}',
        appFallback: '\u{F0F1D}',   // generic app-window glyph, used when no icon is cached yet
        reminder: '\u{F009A}',      // bell (a reminder is set)
        playing: '\u{F03E4}',       // pause: what a click does while it plays
        paused: '\u{F040A}',        // play
      };
      // Omarchy: "dddd HH:mm", alternate "d MMMM 'W'ww yyyy" (12-hour here by request).
      const CLOCK_FORMATS = [CLOCK_24H ? 'EEEE HH:mm' : 'EEEE h:mm a', "d MMMM 'W'WW yyyy"];
      let clockFormat = 0;

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        network: { type: 'network', refreshInterval: 5000 },
        audio: { type: 'audio' },
        cpu: { type: 'cpu', refreshInterval: 5000 },
        battery: { type: 'battery', refreshInterval: 30000 },
        systray: { type: 'systray' },
        // What is playing (Windows' media sessions: Spotify, a browser tab, ...).
        media: { type: 'media' },
      });

      const $ = id => document.getElementById(id);
      $('logo').textContent = ICONS.logo;
      $('awake').textContent = ICONS.awake;
      $('nightlight').textContent = ICONS.nightlight;
      $('dnd').textContent = ICONS.dnd;
      $('uac').textContent = ICONS.uac;
      $('game').textContent = ICONS.game;
      $('dictation').textContent = ICONS.dictation;
      $('recording').textContent = ICONS.recording;
      $('update').textContent = ICONS.update;
      // Omarchy's omarchy.elsewhen: a globe next to the clock that opens the world clock.
      $('elsewhen').textContent = '\u{F01E7}';
      $('elsewhen').onclick = () => act('worldclock');
      $('agents').textContent = ICONS.agents;
      $('winChevron').textContent = ICONS.chevron;
      // Indicators toggle on click (Omarchy); weather/update open details. The icon flips
      // at once and holds for a moment; then indicators.json (winarchy.ahk) has the say again.
      const pinned = {};
      function flip(id) {
        $(id).classList.toggle('off');
        pinned[id] = Date.now() + 1500;
        setTimeout(() => { if (lastInd !== undefined) renderIndicators(lastInd); }, 1600);
      }
      $('awake').onclick = () => { flip('awake'); act('wm', 'awake'); };
      $('nightlight').onclick = () => { flip('nightlight'); act('wm', 'nightlight'); };
      $('dnd').onclick = () => { flip('dnd'); act('wm', 'dnd'); };
      $('uac').onclick = () => act('wm', 'uac');
      // Voice typing (Win+H) needs a focused text field, so the bar opens its settings
      // instead (Omarchy opens the dictation config). Recording = Snipping Tool.
      $('dictation').onclick = () => zebar.shellExec('explorer', 'ms-settings:speech').catch(() => {});
      $('recording').onclick = () => act('send', '#+r');
      // A running game (GlazeWM leaves games alone, so they aren't in the workspaces).
      $('game').onclick = () => act('wm', 'game');
      $('game').oncontextmenu = e => { e.preventDefault(); act('wm', 'game-close'); };
      $('weather').onclick = () => act('wm', 'weather');
      $('update').onclick = () => act('upgrade');
      $('reminder').onclick = () => act('reminder', 'show');
      $('agents').onclick = () => act('usage');
      $('agents').oncontextmenu = e => { e.preventDefault(); act('agent'); };
      // Display (Quattro's omarchy.monitor): click = the panel, scroll = brightness 5 a step
      // (with the OSD). Wheel ticks are summed briefly: each one otherwise starts its own
      // DDC/CI round trip, and those would race each other.
      $('display').onclick = () => act('display-panel');
      $('display').oncontextmenu = e => { e.preventDefault(); act('display-panel'); };
      let wheelSum = 0, wheelTimer = 0;
      $('display').onwheel = e => {
        wheelSum += e.deltaY < 0 ? 5 : -5;
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => { act('brightness-step', String(wheelSum)); wheelSum = 0; }, 120);
      };
      // Tailscale (Quattro): click = the panel, right click = on/off, middle click = refresh.
      $('tailscale').innerHTML = tailscaleMark();
      $('tailscale').onclick = () => act('tailscale-panel');
      $('tailscale').oncontextmenu = e => { e.preventDefault(); act('tailscale', 'toggle'); };
      $('tailscale').onauxclick = e => { if (e.button === 1) act('tailscale', 'refresh'); };

      const act = (...args) => zebar.shellExec(AHK, [MENU, ...args]).catch(e => console.error(e));
      // Text only when it differs: the same text written again still replaces the node and
      // lays the bar out again (the clock ticks every second but shows minutes).
      const setText = (el, text) => { if (el.textContent !== text) el.textContent = text; };

      function wsOrder(ws) {
        const n = Number(ws.name);
        return Number.isNaN(n) ? 99 : n;
      }

      function renderWorkspaces(glaze) {
        const el = $('workspaces');
        if (!glaze) { el.replaceChildren(); return; }
        const list = [...glaze.currentWorkspaces]
          .filter(ws => ws.name !== 'scratch' || ws.isDisplayed)
          .sort((a, b) => wsOrder(a) - wsOrder(b));
        // Elements are kept (not rebuilt) so the hover/focus transitions in bar.css can run.
        const bind = (b, ws) => {
          b.classList.toggle('empty', !ws.children?.length && !ws.isDisplayed);
          b.classList.toggle('focused', !!ws.hasFocus);
          const text = ws.isDisplayed ? ICONS.activeWs : (ws.displayName ?? ws.name);
          if (b.textContent !== text) b.textContent = text;
          b.title = `Workspace ${ws.displayName ?? ws.name}`;
          b.onclick = () => glaze.runCommand(`focus --workspace ${ws.name}`);
        };
        syncList(el, list, ws => ws.name, ws => {
          const b = document.createElement('button');
          b.className = 'workspace';
          bind(b, ws);
          return b;
        }, bind);
        $('logo').classList.toggle('paused', !!glaze.isPaused);
      }

      // Chevron shows whenever the drawer has anything behind it: running-app windows or
      // the native systray (background apps' own icons - not a Quattro system module).
      function updateChevron() {
        $('winChevron').classList.toggle('hidden', !$('winstrip').children.length && !$('tray').children.length);
      }

      // Both the tray (every provider tick, not just its own) and the window list (every 2 s
      // poll) get handed a fresh array whether or not anything actually changed. Rebuilding
      // the DOM wholesale each time (replaceChildren) destroys and recreates every <img>, which
      // reloads its src and re-triggers the reveal's @starting-style fade - the "blink" while
      // hovering. Keep existing elements in place and only touch what's actually different.
      function syncList(container, items, keyOf, build, update) {
        const byKey = new Map();
        for (const el of container.children) byKey.set(el.dataset.key, el);
        let prev = null;
        for (const item of items) {
          const key = String(keyOf(item));
          let el = byKey.get(key);
          if (el) { byKey.delete(key); update(el, item); }
          else { el = build(item); el.dataset.key = key; }
          const want = prev ? prev.nextSibling : container.firstChild;
          if (want !== el) container.insertBefore(el, want === null ? null : want);
          prev = el;
        }
        for (const el of byKey.values()) el.remove();
      }

      function renderTray(tray) {
        const el = $('tray');
        if (!tray) { el.replaceChildren(); updateChevron(); return; }
        // Tailscale has its own bar icon (#tailscale) once installed: hide its native tray icon.
        const icons = tray.icons.filter(icon => !/^tailscale/i.test(icon.tooltip ?? ''));
        syncList(el, icons, icon => icon.id, icon => {
          const img = document.createElement('img');
          bindTrayIcon(img, tray, icon);
          return img;
        }, (img, icon) => bindTrayIcon(img, tray, icon));
        updateChevron();
      }
      function bindTrayIcon(img, tray, icon) {
        if (img.src !== icon.iconUrl) img.src = icon.iconUrl;
        img.title = icon.tooltip;
        img.onclick = e => { e.preventDefault(); tray.onLeftClick(icon.id); };
        img.oncontextmenu = e => { e.preventDefault(); tray.onRightClick(icon.id); };
        img.onauxclick = e => { if (e.button === 1) tray.onMiddleClick(icon.id); };
      }

      // Running apps behind the chevron (windows.json, written by winarchy.ahk). Icons are
      // extracted lazily on the PowerShell side; a not-yet-cached one falls back to a glyph
      // rather than waiting, since the fetch is async and the list refreshes every 2 s anyway.
      function renderWindows(win) {
        const el = $('winstrip');
        const list = (win?.windows ?? []).filter(w => !/^tailscale/i.test(w.exe));
        syncList(el, list, w => w.icon, w => windowIcon(w, `./icons/${w.icon}.png`), (elm, w) => {
          bindWindowIcon(elm, w);
          // The glyph stands in only until the icon is cached: look again every few seconds,
          // since the element for this app is kept (and so never loads it) otherwise.
          if (elm.tagName !== 'SPAN' || Date.now() - (elm._tried ?? 0) < 5000) return;
          elm._tried = Date.now();
          const probe = new Image();
          probe.onload = () => {
            if (!elm.isConnected) return;
            const img = windowIcon(w, probe.src);
            img.dataset.key = elm.dataset.key;
            elm.replaceWith(img);
          };
          probe.src = `./icons/${w.icon}.png?${elm._tried}`;
        });
        updateChevron();
      }
      function windowIcon(w, src) {
        const img = document.createElement('img');
        img.src = src;
        img.onerror = () => {
          const span = document.createElement('span');
          span.dataset.key = img.dataset.key;
          span.className = img.className + ' fallback';
          span.title = img.title;
          span.textContent = ICONS.appFallback;
          span.onclick = img.onclick;
          span._tried = Date.now();
          img.replaceWith(span);
        };
        bindWindowIcon(img, w);
        return img;
      }
      function bindWindowIcon(el, w) {
        el.className = (w.focused ? 'win focused' : 'win') + (el.tagName === 'SPAN' ? ' fallback' : '');
        el.title = w.title;
        el.onclick = () => act('focus-window', w.hwnd);
      }

      // network.json (winarchy.ahk, read from Windows) says which link carries traffic; Zebar's
      // network provider is only the fallback while that file is missing.
      let netLink = null;
      function renderNetwork(net) {
        const el = $('network');
        if (netLink) {
          if (netLink.type === 'ethernet') { setText(el, ICONS.ethernet); el.title = netLink.name || 'Ethernet'; }
          else if (netLink.type === 'wifi') {
            const s = netLink.signal ?? 0;
            setText(el, ICONS.wifi[Math.min(4, Math.floor(s / 20))]);
            el.title = `${netLink.ssid || 'Wi-Fi'} (${s}%)`;
          } else { setText(el, ICONS.offline); el.title = 'Disconnected'; }
          return;
        }
        const iface = net?.defaultInterface;
        if (!iface) { setText(el, ICONS.offline); el.title = 'Disconnected'; return; }
        if (iface.type === 'wifi') {
          const s = net.defaultGateway?.signalStrength ?? 0;
          setText(el, ICONS.wifi[Math.min(4, Math.floor(s / 20))]);
          el.title = `${net.defaultGateway?.ssid ?? 'Wi-Fi'} (${s}%)`;
        } else {
          setText(el, ICONS.ethernet);
          el.title = iface.friendlyName ?? iface.name;
        }
      }

      function renderAudio(audio) {
        const el = $('audio');
        const dev = audio?.defaultPlaybackDevice;
        if (!dev) { setText(el, ''); return; }
        setText(el, dev.isMuted ? ICONS.mute : ICONS.vol[dev.volume < 34 ? 0 : dev.volume < 67 ? 1 : 2]);
        el.title = `${dev.name}: ${dev.isMuted ? 'muted' : Math.round(dev.volume) + '%'} (click: panel, right click: mute, scroll: volume)`;
      }

      // Open-Meteo WMO codes -> Nerd Font weather glyphs (day / night).
      function weatherIcon(code, day) {
        if (code === 0 || code === 1) return day ? '\u{F0599}' : '\u{F0594}';   // sunny / clear night
        if (code === 2) return day ? '\u{F0595}' : '\u{F0F31}';                 // partly cloudy
        if (code === 3) return '\u{F0590}';                                      // cloudy
        if (code === 45 || code === 48) return '\u{F0591}';                      // fog
        if (code >= 51 && code <= 67) return '\u{F0597}';                        // rain
        if (code >= 71 && code <= 77) return '\u{F0598}';                        // snow
        if (code >= 80 && code <= 82) return '\u{F0596}';                        // pouring
        if (code === 85 || code === 86) return '\u{F0F36}';                      // snowy rain
        if (code >= 95) return '\u{F0593}';                                      // lightning
        return '\u{F0590}';
      }
      function renderWeather(w) {
        const el = $('weather');
        el.classList.toggle('hidden', !w || w.temp === undefined);
        if (!w || w.temp === undefined) return;
        el.textContent = `${weatherIcon(w.code, w.isDay)} ${w.temp}°`;
        el.title = w.text;
      }

      // agents.json (winarchy agent-usage): only agents with usage or limits to show, so an
      // empty list means there is nothing to say and the module leaves the bar entirely.
      function renderAgents(usage) {
        const el = $('agents');
        const agents = usage?.agents ?? [];
        el.classList.toggle('hidden', !agents.length);
        if (!agents.length) return;
        const pct = p => `${Math.round(p * 100)}%`;
        const tokens = n => n >= 1e9 ? `${(n / 1e9).toFixed(1)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M`
          : n >= 1e3 ? `${Math.round(n / 1e3)}K` : `${n}`;
        el.title = agents.map(a => [
          `${a.name}${a.tierLabel ? ` (${a.tierLabel})` : ''}`,
          ...(a.limits ?? []).map(l => `  ${l.label}: ${pct(l.percent)} used`),
          `  Today: ${tokens(a.todayTotalTokens ?? 0)} tokens`,
          ...(a.usageStatusText ? [`  ${a.usageStatusText}`] : []),
        ].join('\n')).join('\n') + '\nClick: usage · Right-click: start agent';
      }

      // Omarchy's media module: what is playing, left of the clock. Click: play / pause,
      // right click: next track, middle click: previous. Gone when nothing is playing.
      function renderMedia(media) {
        const el = $('media');
        const s = media?.session;
        el.classList.toggle('hidden', !s?.title);
        if (!s?.title) return;
        const text = s.artist ? `${s.artist} - ${s.title}` : s.title;
        setText(el, `${s.isPlaying ? ICONS.playing : ICONS.paused} ${text.length > 40 ? text.slice(0, 39) + '…' : text}`);
        el.title = `${text}\nClick: ${s.isPlaying ? 'pause' : 'play'} · Right-click: next · Middle-click: previous`;
      }
      $('media').onclick = () => providers.outputMap.media?.togglePlayPause().catch(() => {});
      $('media').oncontextmenu = e => { e.preventDefault(); providers.outputMap.media?.next().catch(() => {}); };
      $('media').onauxclick = e => { if (e.button === 1) { e.preventDefault(); providers.outputMap.media?.previous().catch(() => {}); } };

      // reminders.json (winarchy reminder): the next one, as a bell and its time. Gone once
      // it is due; the reminder's own OSD takes over from there.
      function renderReminder(r) {
        const el = $('reminder');
        const at = r?.next?.at ? new Date(r.next.at) : null;
        const show = at && at > new Date();
        el.classList.toggle('hidden', !show);
        if (!show) return;
        const time = at.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: !CLOCK_24H });
        setText(el, `${ICONS.reminder} ${time}`);
        const more = (r.count ?? 1) > 1 ? `\n${r.count - 1} more after it` : '';
        el.title = `${r.next.message}${more}\nClick: all reminders · Super+Ctrl+R: set one`;
      }

      function renderBluetooth(bt) {
        const el = $('bluetooth');
        el.classList.toggle('hidden', !bt?.present);
        if (!bt?.present) return;
        el.textContent = bt.on ? ICONS.btOn : ICONS.btOff;
        el.classList.toggle('muted', !bt.on);
        el.title = `Bluetooth ${bt.on ? 'on' : 'off'} (click: panel)`;
      }

      // Quattro's TailscaleIcon: the logo as a 3x3 dot grid in the text color (middle row and
      // bottom-center solid, the rest faint), struck through when off, a "!" badge when it
      // needs a sign-in. Drawn in SVG so it scales with the text like the glyphs around it.
      function tailscaleMark() {
        const faint = [0, 1, 2, 6, 8];
        const dots = [...Array(9)].map((_, i) =>
          `<circle cx="${1.2 + (i % 3) * 3.8}" cy="${1.2 + Math.floor(i / 3) * 3.8}" r="1.2" opacity="${faint.includes(i) ? 0.24 : 1}"/>`).join('');
        return `<svg class="ts-mark" viewBox="0 0 10 10" aria-hidden="true"><g fill="currentColor">${dots}</g>`
          + '<line class="ts-strike" x1="-0.6" y1="10.6" x2="10.6" y2="-0.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'
          + '<g class="ts-badge"><circle cx="8.6" cy="8.6" r="2.4"/><text x="8.6" y="9.9" text-anchor="middle">!</text></g></svg>';
      }
      // tailscale.json says whether it is installed; tailscale-status.json is `tailscale
      // status --json` (both written by winarchy.ahk every 30 s, and after any action).
      function renderTailscale(ts, st) {
        const el = $('tailscale');
        el.classList.toggle('hidden', !ts?.installed);
        if (!ts?.installed) return;
        const state = st?.BackendState ?? '';
        const on = state === 'Running', login = state === 'NeedsLogin';
        el.classList.toggle('ts-off', !on && !login);
        el.classList.toggle('ts-login', login);
        const text = login ? 'Needs login' : on ? 'Connected' : state === 'Stopped' ? 'Disconnected' : state || 'Unavailable';
        const tailnet = st?.CurrentTailnet?.Name;
        el.title = `Tailscale: ${text}${on && tailnet ? ` (${tailnet})` : ''}\nClick: machines · Right-click: ${on ? 'turn off' : login ? 'sign in' : 'turn on'}`;
      }

      function renderDisplay(glaze) {
        const n = glaze?.allMonitors?.length ?? 1;
        setText($('display'), n > 1 ? ICONS.monitors : ICONS.monitor);
        $('display').title = 'Display: brightness, text size, scale (click) · Scroll: brightness';
      }

      function renderCpu(cpu) {
        setText($('cpu'), ICONS.cpu);
        $('cpu').title = cpu ? `CPU ${Math.round(cpu.usage)}%` : 'CPU';
      }

      function renderBattery(bat) {
        const el = $('battery');
        if (!bat || bat.state === 'unknown') { el.classList.add('hidden'); return; }
        el.classList.remove('hidden');
        setText(el, bat.isCharging
          ? ICONS.charging
          : ICONS.battery[Math.min(5, Math.floor(bat.chargePercent / 20))]);
        el.title = `Battery ${Math.round(bat.chargePercent)}%`;
      }

      // Each provider's output is a new object when it emits (the group's map too), so only
      // the one that changed is drawn again: the cpu and network ticks every 5 s used to
      // redraw every module, workspaces and tray included.
      const RENDER = {
        glazewm: g => { renderWorkspaces(g); renderDisplay(g); },
        systray: renderTray, network: renderNetwork, audio: renderAudio,
        cpu: renderCpu, battery: renderBattery, media: renderMedia,
      };
      const drawn = {};
      function render() {
        const o = providers.outputMap;
        for (const k in RENDER) {
          if (k in drawn && drawn[k] === o[k]) continue;
          drawn[k] = o[k];
          RENDER[k](o[k]);
        }
      }

      // Double-click on empty bar space toggles the transparent bar (as in Omarchy); a
      // double-click on a module is that module's business.
      $('bar').addEventListener('dblclick', e => {
        if (e.target.closest('.module, .indicator, .workspace, .logo, #clock, .drawer, button')) return;
        act('bar-clear');
      });

      // Logo: left click = Omarchy menu, right click = terminal (as in Omarchy).
      $('logo').onclick = () => act('open', 'root');
      $('logo').oncontextmenu = e => { e.preventDefault(); act('terminal'); };

      // Clock: left click = calendar (Super + Ctrl + Alt + D, as Quattro's calendar popup); right click = next format.
      $('clock').onclick = () => act('calendar');
      $('clock').onauxclick = e => { if (e.button === 1) { e.preventDefault(); act('worldclock'); } };
      $('clock').oncontextmenu = e => {
        e.preventDefault();
        clockFormat = (clockFormat + 1) % CLOCK_FORMATS.length;
        startClock();
      };
      let clock = null;
      function startClock() {
        clock?.stop();
        clock = zebar.createProvider({ type: 'date', formatting: CLOCK_FORMATS[clockFormat] });
        clock.onOutput(d => setText($('clock'), d.formatted));
      }
      startClock();

      // Click actions (Omarchy opens btop / audio panel; closest Windows equivalents).
      $('cpu').onclick = () => act('activity');   // btop (Omarchy's Activity)
      $('cpu').oncontextmenu = e => { e.preventDefault(); zebar.shellExec('taskmgr').catch(() => {}); };
      // Network / audio / bluetooth: Quattro's own panels (speed test, DNS and Wi-Fi; the
      // mixer; paired devices). Right click on the network icon still opens Windows' settings.
      $('network').onclick = () => act('network-panel');
      $('network').oncontextmenu = e => { e.preventDefault(); zebar.shellExec('explorer', 'ms-settings:network').catch(() => {}); };
      // Audio / Bluetooth: left click toggles Windows' quick panel (as Super+Ctrl+A / B);
      // audio right click mutes, scroll changes volume.
      $('audio').onclick = () => act('audio-panel');
      $('audio').oncontextmenu = e => {
        e.preventDefault();
        const dev = providers.outputMap.audio?.defaultPlaybackDevice;
        if (dev) providers.outputMap.audio.setMute(!dev.isMuted);
      };
      $('bluetooth').onclick = () => act('bluetooth-panel');
      $('audio').onwheel = e => {
        const audio = providers.outputMap.audio;
        const dev = audio?.defaultPlaybackDevice;
        if (!dev) return;
        const v = Math.max(0, Math.min(100, dev.volume + (e.deltaY < 0 ? 5 : -5)));
        audio.setVolume(v);
      };

      // Quattro indicators: on = full color next to the clock; off = hidden until
      // the center is hovered, then dimmed further left (click turns it on).
      function setIndicator(id, on, tipOn, tipOff) {
        if (pinned[id] > Date.now()) return;   // just clicked: flip() has it
        $(id).classList.toggle('off', !on);
        $(id).title = on ? tipOn : tipOff;
      }
      // Hovering the indicators, clock or weather reveals the inactive indicators; they
      // stay until the pointer leaves the bar (120 ms grace, as Quattro).
      // WebView2 doesn't always report the pointer leaving the bar (it got stuck open after
      // clicking an indicator), so while they are revealed, also ask where the cursor is.
      const tauri = window.__TAURI_INTERNALS__;
      const winLabel = tauri?.metadata?.currentWindow?.label;
      async function pointerInBar() {
        try {
          const [c, p, s] = await Promise.all(['cursor_position', 'outer_position', 'outer_size']
            .map(cmd => tauri.invoke(`plugin:window|${cmd}`, { label: winLabel })));
          return c.x >= p.x && c.x < p.x + s.width && c.y >= p.y && c.y < p.y + s.height;
        } catch { return true; }
      }
      let revealTimer = 0, revealCheck = 0;
      function collapse() {
        clearTimeout(revealTimer);
        clearInterval(revealCheck);
        revealCheck = 0;
        $('bar').classList.remove('reveal');
      }
      function reveal() {
        clearTimeout(revealTimer);
        $('bar').classList.add('reveal');
        if (tauri && !revealCheck) revealCheck = setInterval(async () => { if (!(await pointerInBar())) collapse(); }, 250);
      }
      for (const id of ['indicators', 'clock', 'post']) $(id).addEventListener('mouseenter', reveal);
      // The whole middle of the bar is the hover target, not just the clock and the icons
      // themselves; leaving that zone folds them again (the icons' own boxes stay part of it).
      document.body.addEventListener('mousemove', e => {
        const half = Math.max(300, innerWidth * 0.2);
        if (Math.abs(e.clientX - innerWidth / 2) < half) reveal();
        else if ($('bar').classList.contains('reveal') && !e.target.closest('#indicators, #clock, #post')) collapse();
      });
      document.body.addEventListener('mouseenter', () => clearTimeout(revealTimer));
      document.body.addEventListener('mouseleave', () => {
        clearTimeout(revealTimer);
        revealTimer = setTimeout(collapse, 120);
      });

      // Running-apps chevron: same reveal/collapse idiom, its own class so hovering the
      // clock/indicators doesn't also unfold the window strip and vice versa.
      let winRevealTimer = 0, winRevealCheck = 0;
      function winCollapse() {
        clearTimeout(winRevealTimer);
        clearInterval(winRevealCheck);
        winRevealCheck = 0;
        $('bar').classList.remove('winreveal');
      }
      function winReveal() {
        clearTimeout(winRevealTimer);
        $('bar').classList.add('winreveal');
        if (tauri && !winRevealCheck) winRevealCheck = setInterval(async () => { if (!(await pointerInBar())) winCollapse(); }, 250);
      }
      $('drawer').addEventListener('mouseenter', winReveal);
      document.body.addEventListener('mouseenter', () => clearTimeout(winRevealTimer));
      document.body.addEventListener('mouseleave', () => {
        clearTimeout(winRevealTimer);
        winRevealTimer = setTimeout(winCollapse, 120);
      });

      // status.json (theme version) and indicators.json (stay awake) are written by
      // winarchy.ps1 / winarchy.ahk. A new theme swaps theme.css without restarting Zebar.
      // Each file is read as text and handled only when it changed; what you just did (a
      // theme, an indicator, the transparent bar, a window) is looked at every half second,
      // the rest every 3 s.
      let themeVersion = null;
      const seen = new Map();
      const text = f => fetch(`./${f}?t=${Date.now()}`, { cache: 'no-store' }).then(r => (r.ok ? r.text() : '')).catch(() => null);
      // on[file](json): '' is a missing file (null, as it always was); a failed read is skipped.
      async function sync(on, raw = []) {
        const files = Object.keys(on);
        const texts = await Promise.all(files.map(text));
        files.forEach((f, i) => {
          const t = texts[i];
          if (t === null || t === seen.get(f)) return;
          let v = t;
          if (!raw.includes(f)) {
            v = null;
            if (t) { try { v = JSON.parse(t); } catch { return; } }   // half written: next time
          }
          seen.set(f, t);
          on[f](v);
        });
      }
      // A loop that waits for its last round, so a slow read never piles up behind itself.
      const every = (ms, fn) => { const run = async () => { try { await fn(); } catch (e) { console.error(e); } setTimeout(run, ms); }; run(); };

      function renderIndicators(ind) {
        setIndicator('nightlight', ind?.nightlight, 'Day Light (Super+Ctrl+N)', 'Night Light (Super+Ctrl+N)');
        setIndicator('dnd', ind?.dnd, 'Allow Notifications (Super+Ctrl+,)', 'Silence Notifications (Super+Ctrl+,)');
        setIndicator('awake', ind?.awake, 'Allow Idle Lock & Screensaver (Super+Ctrl+I)', 'Stay Awake (Super+Ctrl+I)');
        setIndicator('recording', ind?.recording, 'Recording (stop it in the Snipping Tool bar)', 'Screen Recording (Alt+PrtSc)');
        setIndicator('dictation', false, '', 'Dictate: Super+Ctrl+X in a text field (click: speech settings)');
        // A UAC prompt parked in the (hidden) taskbar; clicking opens it.
        $('uac').classList.toggle('hidden', !ind?.uac);
        $('uac').title = ind?.uac ? `${ind.uac}\nClick to open the admin prompt` : '';
        $('game').classList.toggle('hidden', !ind?.game);
        $('game').title = ind?.game
          ? `${ind.game}\nClick: switch to it\nRight-click or Super+W: close it (twice: force-quit)` : '';
      }
      function renderUpdates(updates) {
        const ups = updates?.items ?? [];
        $('update').classList.toggle('hidden', !ups.length);
        $('update').title = ups.length
          ? `Updates (click to update):\n${ups.map(u => `${u.name}: ${u.from} -> ${u.to}`).join('\n')}` : '';
      }

      let lastInd, lastWindows = null, lastReminders = null, ts = null, tsStatus = null, userCss = null;
      every(500, () => sync({
        'status.json': status => {
          if (!status?.themeVersion || status.themeVersion === themeVersion) return;
          if (themeVersion !== null) {
            $('theme').href = `./theme.css?v=${status.themeVersion}`;
            $('font').href = `./font.css?v=${status.themeVersion}`;
          }
          themeVersion = status.themeVersion;
        },
        'indicators.json': ind => { lastInd = ind; renderIndicators(ind); },
        // Double-click transparency (bar-state.json is written by `menu.ahk bar-clear`).
        'bar-state.json': barState => document.documentElement.classList.toggle('clear', !!barState?.clear),
        'windows.json': windows => { lastWindows = windows; renderWindows(windows); },
      }));
      every(3000, async () => {
        await sync({
          'bluetooth.json': renderBluetooth,
          'weather.json': renderWeather,
          'updates.json': renderUpdates,
          'agents.json': renderAgents,
          // Written by `winarchy reminder` (lib/system.ps1) into the pack, never shipped in it.
          'reminders.json': r => { lastReminders = r; },
          'network.json': link => { netLink = link; renderNetwork(providers.outputMap.network); },
          'tailscale.json': t => { ts = t; renderTailscale(ts, ts?.installed ? tsStatus : null); },
          'tailscale-status.json': st => { tsStatus = st; renderTailscale(ts, ts?.installed ? tsStatus : null); },
          // Style > Top Bar (your CSS): reload user.css when it is saved.
          'user.css': () => { if (userCss !== null) $('user').href = `./user.css?v=${Date.now()}`; userCss = true; },
        }, ['user.css']);
        // Time goes by without a file changing: the bell goes when its reminder is due, and a
        // window's own icon replaces the placeholder once it has been extracted.
        renderReminder(lastReminders);
        if (lastWindows && $('winstrip').querySelector('.fallback')) renderWindows(lastWindows);
      });

      providers.onOutput(render);
      render();
    </script>
  </body>
</html>
